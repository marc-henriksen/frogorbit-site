<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#080808"><title>Browse | IHateRecruiters</title><script>try{if(localStorage.getItem('ihr-theme')==='light')document.documentElement.dataset.theme='light'}catch(e){}</script><style>:root{color-scheme:dark;--bg:#080808;--ink:#fff;--accent:#D71945;--muted:#d5d5d5;--hover:#191919} :root[data-theme=light]{color-scheme:light;--bg:#fff;--ink:#101010;--muted:#383838;--hover:#f3f3f3}*{box-sizing:border-box}html,body{background:var(--bg)}body{margin:0;color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:760px;margin:auto;padding:32px 20px 60px}a{color:inherit}a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:4px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:58px}.brand{font-size:20px;font-weight:850;text-decoration:none}.back{font-size:14px;text-decoration:none;border-bottom:1px solid var(--accent)}h1{font-size:clamp(35px,7vw,58px);line-height:1.08;margin:0 0 20px}h2{font-size:clamp(23px,4vw,31px);line-height:1.2;margin:0 0 12px}p{margin:0 0 18px}.lead{font-size:clamp(19px,3vw,23px)}.kicker{color:var(--accent);font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin-bottom:14px}.block{border-top:1px solid var(--ink);padding:28px 0;margin-top:24px}.card{border:1px solid var(--ink);border-radius:13px;padding:22px;margin:28px 0}.card p:last-child,.block p:last-child{margin-bottom:0}.note{color:var(--muted);font-size:14px}.accent{color:var(--accent)}.theme-area{display:flex;justify-content:center;margin:45px 0 20px}.theme-switch{display:inline-flex;gap:5px;border:1px solid var(--ink);border-radius:999px;padding:5px}.theme-option{font:inherit;font-size:13px;color:var(--ink);background:transparent;border:0;border-radius:999px;padding:9px 15px;cursor:pointer}.theme-option[aria-pressed=true]{background:var(--accent);color:white;font-weight:700}footer{text-align:center;font-size:13px;color:var(--muted)}footer small{display:block;margin-top:9px} @media(max-width:420px){main{padding:26px 16px 45px}.top{margin-bottom:40px}}.job-item{border:1px solid var(--ink);border-radius:13px;padding:22px;margin:18px 0}.job-item h2{margin:0 0 6px}.job-item h2 a{text-decoration:none;border-bottom:2px solid var(--accent)}.job-item .company{font-weight:700;margin-bottom:8px}.job-item .note{margin:0}#pages{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:25px 0}#pages button{font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--ink);border-radius:8px;padding:10px;cursor:pointer}#pages button:disabled{opacity:.4;cursor:default}[hidden]{display:none!important}</style></head><body><main><nav class="top"><a class="brand" href="../">IHateRecruiters</a><a class="back" href="../">← Back</a></nav><div class="kicker">3. Browse</div><h1>See what else is out there</h1><p class="lead">No algorithmic wisdom. No motivational speeches. Just jobs people thought were worth sharing</p><section id="job-feed" aria-live="polite"><p class="note">Loading jobs…</p></section><nav id="pages" aria-label="Job pages" hidden><button id="previous" type="button">← Previous</button><span id="page-number"></span><button id="next" type="button">Next →</button></nav><div class="theme-area"><div class="theme-switch" role="group" aria-label="Color theme"><button class="theme-option" data-choice="light" aria-pressed="false" type="button">☀ Light</button><button class="theme-option" data-choice="dark" aria-pressed="true" type="button">☾ Dark</button></div></div><footer>No recruiters were harmed in the making of this website<small>© 2026 IHateRecruiters</small></footer></main><script>(function(){const b=document.querySelectorAll('.theme-option');function apply(t){document.documentElement.dataset.theme=t;b.forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.choice===t)));try{localStorage.setItem('ihr-theme',t)}catch(e){}}let t='dark';try{if(localStorage.getItem('ihr-theme')==='light')t='light'}catch(e){}apply(t);b.forEach(x=>x.addEventListener('click',()=>apply(x.dataset.choice)))})()</script><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const db=createClient('https://pvtwxtnbsospauqkrbek.supabase.co','sb_publishable_I2QGmFehSnVkANPPWNaxkQ_dQLBvSh_');
const feed=document.getElementById('job-feed'),pages=document.getElementById('pages');
const previous=document.getElementById('previous'),next=document.getElementById('next'),number=document.getElementById('page-number');
let page=0;const size=10;
async function load(){
 feed.textContent='Loading jobs…';pages.hidden=true;
 const {data,error,count}=await db.from('jobs').select('id,title,company,url,created_at,expires_at',{count:'exact'}).gt('expires_at',new Date().toISOString()).order('created_at',{ascending:false}).range(page*size,page*size+size-1);
 if(error){feed.textContent='Could not load jobs. Please try again later';return}
 feed.replaceChildren();
 if(!data.length){const empty=document.createElement('div');empty.className='card';const h=document.createElement('h2');h.textContent=page?'No more jobs':'No jobs yet. How embarrassing';empty.append(h);feed.append(empty)}
 for(const job of data){
 const card=document.createElement('article');card.className='job-item';
 const heading=document.createElement('h2');const link=document.createElement('a');link.href=job.url;link.target='_blank';link.rel='noopener noreferrer';link.textContent=job.title;heading.append(link);
 const company=document.createElement('p');company.className='company';company.textContent=job.company;
 const date=document.createElement('p');date.className='note';date.textContent='Shared '+new Date(job.created_at).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})+' · Expires '+new Date(job.expires_at).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
 card.append(heading,company,date);feed.append(card);
 }
 const total=count||0;pages.hidden=total<=size&&page===0;previous.disabled=page===0;next.disabled=(page+1)*size>=total;number.textContent='Page '+(page+1)+' of '+Math.max(1,Math.ceil(total/size));
}
previous.addEventListener('click',()=>{if(page>0){page--;load()}});
next.addEventListener('click',()=>{page++;load()});
load();
</script></body></html>
