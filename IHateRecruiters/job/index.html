<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#080808"><title>Job discussion | IHateRecruiters</title><script>try{if(localStorage.getItem('ihr-theme')==='light')document.documentElement.dataset.theme='light'}catch(e){}</script><style>
:root{color-scheme:dark;--bg:#080808;--ink:#fff;--accent:#D71945;--muted:#d5d5d5}:root[data-theme=light]{color-scheme:light;--bg:#fff;--ink:#101010;--muted:#383838}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:760px;margin:auto;padding:32px 20px 55px}a{color:inherit}button,input,textarea{font:inherit}button{cursor:pointer}a:focus-visible,button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:55px}.brand{font-size:20px;font-weight:850;text-decoration:none}.back{font-size:14px;text-decoration:none;border-bottom:1px solid var(--accent)}.kicker{color:var(--accent);font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin-bottom:14px}h1{font-size:clamp(35px,7vw,58px);line-height:1.08;margin:0 0 14px}h2{font-size:clamp(23px,4vw,31px);margin:0 0 12px}p{margin:0 0 16px}.muted{color:var(--muted);font-size:14px}.external,.primary{display:inline-block;border:0;border-radius:8px;background:var(--accent);color:#fff;padding:12px 16px;font-weight:750;text-decoration:none}.external{margin:14px 0 24px}.section{border-top:1px solid var(--ink);padding-top:26px;margin-top:25px}.comment{border:1px solid var(--ink);border-radius:12px;padding:18px;margin:14px 0;overflow-wrap:anywhere}.comment p{white-space:pre-wrap;margin:8px 0 0}.comment .muted{margin:0}.op{color:var(--accent);font-weight:800}.field{display:block;width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--ink);border-radius:8px;padding:12px;margin:12px 0}textarea{min-height:100px;resize:vertical}.theme-area{display:flex;justify-content:center;margin:45px 0 20px}.theme-switch{display:inline-flex;gap:5px;border:1px solid var(--ink);border-radius:999px;padding:5px}.theme-option{font-size:13px;color:var(--ink);background:transparent;border:0;border-radius:999px;padding:9px 15px}.theme-option[aria-pressed=true]{background:var(--accent);color:white;font-weight:700}footer{text-align:center;font-size:13px;color:var(--muted)}footer small{display:block;margin-top:9px}[hidden]{display:none!important}@media(max-width:420px){main{padding:26px 16px 45px}.top{margin-bottom:40px}}
</style></head><body><main><nav class="top"><a class="brand" href="../">IHateRecruiters</a><a class="back" href="../">← Browse</a></nav><div class="kicker">Job discussion</div><section id="job"><h1>Loading job…</h1></section><section class="section"><h2>Questions and answers</h2><div id="comments" aria-live="polite"><p class="muted">Loading discussion…</p></div><div id="contribute"><p id="auth-status" class="muted"></p><form id="comment-form" hidden><label for="comment-body">Ask a question or share what you know</label><textarea class="field" id="comment-body" maxlength="2000" minlength="2" required></textarea><button class="primary" type="submit">Post comment →</button></form><form id="login-form" hidden><label for="login-email">Sign in with your email to join the discussion</label><input class="field" id="login-email" type="email" placeholder="you@example.com" required><button class="primary" type="submit">Send sign-in link →</button></form><p id="action-status" class="muted" role="status" aria-live="polite"></p></div></section><div class="theme-area"><div class="theme-switch" role="group" aria-label="Color theme"><button class="theme-option" data-choice="light" aria-pressed="false" type="button">☀ Light</button><button class="theme-option" data-choice="dark" aria-pressed="true" type="button">☾ Dark</button></div></div><footer>No recruiters were harmed in the making of this website<small>© 2026 IHateRecruiters</small></footer></main><script>(function(){const b=document.querySelectorAll('.theme-option');function apply(t){document.documentElement.dataset.theme=t;b.forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.choice===t)));try{localStorage.setItem('ihr-theme',t)}catch(e){}}let t='dark';try{if(localStorage.getItem('ihr-theme')==='light')t='light'}catch(e){}apply(t);b.forEach(x=>x.addEventListener('click',()=>apply(x.dataset.choice)))})()</script>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const db=createClient('https://pvtwxtnbsospauqkrbek.supabase.co','sb_publishable_I2QGmFehSnVkANPPWNaxkQ_dQLBvSh_');
const $=id=>document.getElementById(id),id=new URLSearchParams(location.search).get('id');
const validId=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id||'');
let job=null;
function node(tag,cls,content){const n=document.createElement(tag);if(cls)n.className=cls;if(content!==undefined)n.textContent=content;return n}
async function loadJob(){
 if(!validId){$('job').replaceChildren(node('h1','', 'Job not found'));$('comments').textContent='';$('contribute').hidden=true;return}
 const {data,error}=await db.from('jobs').select('id,title,company,url,author_id,expires_at').eq('id',id).gt('expires_at',new Date().toISOString()).maybeSingle();
 if(error||!data){$('job').replaceChildren(node('h1','','This job is no longer available'));$('comments').textContent='';$('contribute').hidden=true;return}
 job=data;const heading=node('h1','',job.title),company=node('p','',job.company),expires=node('p','muted','Available until '+new Date(job.expires_at).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}));
 const link=node('a','external','View original job posting ↗');link.href=job.url;link.target='_blank';link.rel='noopener noreferrer';$('job').replaceChildren(heading,company,expires,link);
 await Promise.all([loadComments(),refreshAuth()]);
}
async function loadComments(){
 const {data,error}=await db.from('comments').select('id,body,author_id,created_at').eq('job_id',id).order('created_at',{ascending:true});
 const container=$('comments');container.replaceChildren();
 if(error){container.append(node('p','muted','Could not load comments'));return}
 if(!data.length){container.append(node('p','muted','No questions yet. Be the first to ask'));return}
 for(const comment of data){
 const card=node('article','comment');const label=node('p','muted',new Date(comment.created_at).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}));
 if(comment.author_id===job.author_id){const op=node('span','op','Original poster · ');label.prepend(op)}
 card.append(label,node('p','',comment.body));container.append(card)
 }
}
async function refreshAuth(){
 const {data:{user}}=await db.auth.getUser();$('comment-form').hidden=!user;$('login-form').hidden=!!user;$('auth-status').textContent=user?'Signed in as '+user.email:'Read freely. Sign in to ask or answer';
}
$('comment-form').addEventListener('submit',async e=>{
 e.preventDefault();const button=e.currentTarget.querySelector('button');button.disabled=true;$('action-status').textContent='Posting…';
 const {error}=await db.from('comments').insert({job_id:id,body:$('comment-body').value.trim()});
 $('action-status').textContent=error?error.message:'Comment posted';
 if(!error){e.currentTarget.reset();await loadComments()}button.disabled=false;
});
$('login-form').addEventListener('submit',async e=>{
 e.preventDefault();$('action-status').textContent='Sending sign-in link…';
 const {error}=await db.auth.signInWithOtp({email:$('login-email').value.trim(),options:{emailRedirectTo:location.origin+location.pathname+location.search}});
 $('action-status').textContent=error?error.message:'Check your inbox for a sign-in link';
});
db.auth.onAuthStateChange(()=>setTimeout(()=>{if(job)refreshAuth()},0));
loadJob().catch(()=>{$('job').replaceChildren(node('h1','','Could not load job'));$('comments').textContent=''});
</script></body></html>
